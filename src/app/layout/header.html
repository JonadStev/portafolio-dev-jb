<header class="header">
  <a class="header__brand" [routerLink]="['/', i18n.lang()]" (click)="closeMenu()"
    >Jonathan Burgos</a
  >

  <button
    type="button"
    class="icon-btn header__burger"
    aria-controls="main-nav"
    [attr.aria-expanded]="open()"
    [attr.aria-label]="open() ? i18n.t().nav.closeMenu : i18n.t().nav.menu"
    (click)="toggleMenu()"
  >
    <svg
      aria-hidden="true"
      width="20"
      height="20"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="1.6"
      stroke-linecap="round"
    >
      @if (open()) {
        <path d="M6 6l12 12M18 6L6 18" />
      } @else {
        <path d="M4 8h16M4 16h16" />
      }
    </svg>
  </button>

  <nav
    id="main-nav"
    class="header__nav"
    [class.is-open]="open()"
    [attr.aria-label]="i18n.t().nav.label"
  >
    @for (item of i18n.t().nav.items; track item.id) {
      <a
        class="header__link"
        [routerLink]="['/', i18n.lang()]"
        [fragment]="item.id"
        [class.is-here]="active() === item.id"
        [attr.aria-current]="active() === item.id ? 'location' : null"
        (click)="closeMenu()"
        >{{ item.label }}</a
      >
    }

    <div class="header__tools">
      <span class="header__sep" aria-hidden="true"></span>
      <span class="header__lang">
        <a
          [routerLink]="['/es']"
          lang="es"
          hreflang="es"
          [attr.aria-current]="i18n.lang() === 'es' ? 'true' : null"
          [class.is-active]="i18n.lang() === 'es'"
          (click)="closeMenu()"
          >ES</a
        >
        <span aria-hidden="true">/</span>
        <a
          [routerLink]="['/en']"
          lang="en"
          hreflang="en"
          [attr.aria-current]="i18n.lang() === 'en' ? 'true' : null"
          [class.is-active]="i18n.lang() === 'en'"
          (click)="closeMenu()"
          >EN</a
        >
      </span>
      <button
        type="button"
        class="icon-btn"
        [attr.aria-label]="i18n.t().nav.theme"
        (click)="themeService.toggle()"
      >
        @if (themeService.theme() === 'dark') {
          <svg
            aria-hidden="true"
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.6"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
          </svg>
        } @else {
          <svg
            aria-hidden="true"
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.6"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <circle cx="12" cy="12" r="4" />
            <path
              d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"
            />
          </svg>
        }
      </button>
    </div>
  </nav>
</header>
